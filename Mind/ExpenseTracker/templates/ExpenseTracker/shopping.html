{% extends 'index.html' %}

{% block title %}Shopping - Mind{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Shopping</h1>
    <button class="btn btn-primary" id="addShoppingBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add Item</span>
    </button>
</div>

<!-- Summary Cards -->
<div class="summary-cards">
    <div class="summary-card">
        <div class="summary-icon" style="background: linear-gradient(135deg, rgba(249, 115, 22, 0.2), rgba(249, 115, 22, 0.05)); color: #f97316;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
        </div>
        <div class="summary-content">
            <span class="summary-label">Total Spending</span>
            <span class="summary-value" id="totalShopping" style="color: #f97316;">₺0,00</span>
        </div>
    </div>
    <div class="summary-card">
        <div class="summary-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
        </div>
        <div class="summary-content">
            <span class="summary-label">Total Items</span>
            <span class="summary-value" id="totalItems">0</span>
        </div>
    </div>
</div>

<!-- Filters -->
<div class="filters-bar">
    <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="input-neon" placeholder="Search items...">
    </div>
    <input type="month" id="filterMonth" class="input-neon">
</div>

<!-- Table -->
<div class="card">
    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="shoppingTableBody">
                <tr class="empty-row">
                    <td colspan="4">
                        <div class="empty-state">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <p>No items found</p>
                            <span class="text-muted">Add your first shopping item</span>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="shoppingModalOverlay">
    <div class="modal" id="shoppingModal">
        <div class="modal-header">
            <h2 class="modal-title">Add Item</h2>
            <button class="modal-close" id="closeShoppingModal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <form id="shoppingForm">
                <div class="form-group">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="input-neon" placeholder="Item name" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Price</label>
                        <input type="number" step="0.01" name="price" class="input-neon" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Date</label>
                        <input type="date" name="date" class="input-neon" required>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" id="cancelShoppingBtn">Cancel</button>
            <button class="btn btn-primary" type="submit" form="shoppingForm">Save</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const addBtn = document.getElementById('addShoppingBtn');
    const modal = document.getElementById('shoppingModal');
    const overlay = document.getElementById('shoppingModalOverlay');
    const closeBtn = document.getElementById('closeShoppingModal');
    const cancelBtn = document.getElementById('cancelShoppingBtn');
    const modalTitle = modal.querySelector('.modal-title');
    const form = document.getElementById('shoppingForm');
    const tableBody = document.getElementById('shoppingTableBody');
    const searchInput = document.getElementById('searchInput');
    const filterMonth = document.getElementById('filterMonth');

    let editingId = null;
    let allItems = [];

    function formatCurrency(v) {
        return `₺${parseFloat(v || 0).toFixed(2).replace('.', ',')}`;
    }

    function getCookie(name) {
        let v = null;
        if (document.cookie && document.cookie !== '') {
            document.cookie.split(';').forEach(c => {
                c = c.trim();
                if (c.substring(0, name.length + 1) === (name + '='))
                    v = decodeURIComponent(c.substring(name.length + 1));
            });
        }
        return v;
    }

    function buildQuery() {
        const params = new URLSearchParams();
        const m = filterMonth.value;
        if (m) {
            const [y, mo] = m.split('-');
            params.append('year', y);
            params.append('month', mo);
        }
        return params.toString();
    }

    async function loadItems() {
        try {
            const q = buildQuery();
            const res = await fetch('/tracker/api/shopping/' + (q ? '?' + q : ''));
            if (res.ok) {
                allItems = await res.json();
                applySearch();
                let total = 0;
                allItems.forEach(i => total += parseFloat(i.price || 0));
                document.getElementById('totalShopping').textContent = formatCurrency(total);
                document.getElementById('totalItems').textContent = allItems.length;
            }
        } catch (e) { console.error(e); }
    }

    function applySearch() {
        const term = searchInput.value.toLowerCase();
        const filtered = term ? allItems.filter(i => i.name.toLowerCase().includes(term)) : allItems;
        renderTable(filtered);
    }

    function renderTable(items) {
        if (items.length === 0) {
            tableBody.innerHTML = `
                <tr class="empty-row"><td colspan="4">
                    <div class="empty-state">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                            <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <p>No items found</p>
                    </div>
                </td></tr>`;
            return;
        }
        tableBody.innerHTML = items.map(i => `
            <tr data-id="${i.id}">
                <td>${i.name}</td>
                <td style="font-weight:600; color:#f97316;">${formatCurrency(i.price)}</td>
                <td>${i.date}</td>
                <td>
                    <div class="action-btns">
                        <button class="action-btn edit-btn" title="Edit">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                            </svg>
                        </button>
                        <button class="action-btn delete delete-btn" title="Delete">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6"></polyline>
                                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                            </svg>
                        </button>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    tableBody.addEventListener('click', function(e) {
        const row = e.target.closest('tr[data-id]');
        if (!row) return;
        const id = row.dataset.id;
        if (e.target.closest('.edit-btn')) {
            fetch(`/tracker/api/shopping/${id}/`)
                .then(r => r.ok ? r.json() : null)
                .then(item => { if (item) openModal(item); });
        }
        if (e.target.closest('.delete-btn')) {
            if (!confirm('Delete this item?')) return;
            fetch(`/tracker/api/shopping/${id}/`, {
                method: 'DELETE',
                headers: { 'X-CSRFToken': getCookie('csrftoken') }
            }).then(r => { if (r.ok) loadItems(); });
        }
    });

    function openModal(item = null) {
        editingId = item ? item.id : null;
        modalTitle.textContent = item ? 'Edit Item' : 'Add Item';
        if (item) {
            form.querySelector('[name="name"]').value = item.name;
            form.querySelector('[name="price"]').value = item.price;
            form.querySelector('[name="date"]').value = item.date;
        } else {
            form.reset();
        }
        overlay.classList.add('active');
        modal.classList.add('active');
    }

    function closeModal() {
        overlay.classList.remove('active');
        modal.classList.remove('active');
        editingId = null;
    }

    form.addEventListener('submit', async function(e) {
        e.preventDefault();
        const fd = new FormData(form);
        const data = { name: fd.get('name'), price: fd.get('price'), date: fd.get('date') };
        const url = editingId ? `/tracker/api/shopping/${editingId}/` : '/tracker/api/shopping/';
        const method = editingId ? 'PUT' : 'POST';
        try {
            const res = await fetch(url, {
                method,
                headers: { 'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken') },
                body: JSON.stringify(data)
            });
            if (res.ok) { closeModal(); form.reset(); loadItems(); }
            else { const err = await res.json(); alert('Failed: ' + JSON.stringify(err)); }
        } catch (e) { console.error(e); }
    });

    addBtn.addEventListener('click', () => openModal());
    closeBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
    searchInput.addEventListener('input', applySearch);
    filterMonth.addEventListener('change', () => loadItems());

    loadItems();
});
</script>
{% endblock %}
