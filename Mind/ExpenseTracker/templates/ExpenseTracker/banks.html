{% extends 'index.html' %}

{% block title %}Banks - Mind{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Banks</h1>
    <button class="btn btn-primary" id="addBankBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Add Bank</span>
    </button>
</div>

<!-- Banks Grid -->
<div class="banks-grid">
    <!-- Empty State Card -->
    <div class="bank-card empty-card" id="addBankCard">
        <div class="bank-add-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </div>
        <span>Add New Bank</span>
    </div>
</div>

<!-- Empty State (shown when no banks) -->
<div class="empty-state-container" id="emptyState">
    <div class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M3 21h18"></path>
            <path d="M3 10h18"></path>
            <path d="M5 6l7-3 7 3"></path>
            <path d="M4 10v11"></path>
            <path d="M20 10v11"></path>
            <path d="M8 14v3"></path>
            <path d="M12 14v3"></path>
            <path d="M16 14v3"></path>
        </svg>
        <h3>No Banks Added</h3>
        <p class="text-muted">Add your banks to track debts and credits</p>
        <button class="btn btn-primary mt-24" id="emptyAddBtn">Add Bank</button>
    </div>
</div>

<!-- Add Bank Modal -->
<div class="modal-overlay" id="bankModalOverlay">
    <div class="modal modal-sm" id="bankModal">
        <div class="modal-header">
            <h2 class="modal-title">Add Bank</h2>
            <button class="modal-close" id="closeBankModal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <form id="bankForm">
                <div class="form-group">
                    <label class="form-label">Bank Name</label>
                    <input type="text" class="input-neon" placeholder="e.g., Chase, Bank of America" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Bank Logo</label>
                    <div class="file-upload">
                        <input type="file" id="bankLogo" accept="image/*" class="file-input">
                        <label for="bankLogo" class="file-label">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span>Choose file or drag here</span>
                        </label>
                        <div class="file-preview" id="logoPreview"></div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" id="cancelBankBtn">Cancel</button>
            <button class="btn btn-primary" type="submit" form="bankForm">Save Bank</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const addBtn = document.getElementById('addBankBtn');
    const addCard = document.getElementById('addBankCard');
    const emptyAddBtn = document.getElementById('emptyAddBtn');
    const modal = document.getElementById('bankModal');
    const overlay = document.getElementById('bankModalOverlay');
    const closeBtn = document.getElementById('closeBankModal');
    const cancelBtn = document.getElementById('cancelBankBtn');
    const fileInput = document.getElementById('bankLogo');
    const preview = document.getElementById('logoPreview');

    function openModal() {
        overlay.classList.add('active');
        modal.classList.add('active');
    }

    function closeModal() {
        overlay.classList.remove('active');
        modal.classList.remove('active');
    }

    [addBtn, addCard, emptyAddBtn].forEach(el => {
        if (el) el.addEventListener('click', openModal);
    });
    closeBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeModal();
    });

    // File preview
    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                preview.classList.add('has-preview');
            };
            reader.readAsDataURL(file);
        }
    });
});
</script>
{% endblock %}
