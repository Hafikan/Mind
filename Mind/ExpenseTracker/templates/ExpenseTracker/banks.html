{% extends 'index.html' %}

{% block title %}Bankalar - Mind{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Bankalar</h1>
    <button class="btn btn-primary" id="addBankBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Banka Ekle</span>
    </button>
</div>

<!-- Banks Grid -->
<div class="banks-grid">
    <!-- Empty State Card -->
    <div class="bank-card empty-card" id="addBankCard">
        <div class="bank-add-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </div>
        <span>Yeni Banka Ekle</span>
    </div>
</div>

<!-- Empty State (shown when no banks) -->
<div class="empty-state-container" id="emptyState">
    <div class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
            <path d="M3 21h18"></path>
            <path d="M3 10h18"></path>
            <path d="M5 6l7-3 7 3"></path>
            <path d="M4 10v11"></path>
            <path d="M20 10v11"></path>
            <path d="M8 14v3"></path>
            <path d="M12 14v3"></path>
            <path d="M16 14v3"></path>
        </svg>
        <h3>Banka Eklenmedi</h3>
        <p class="text-muted">Borç ve kredilerinizi takip etmek için bankalarınızı ekleyin</p>
        <button class="btn btn-primary mt-24" id="emptyAddBtn">Banka Ekle</button>
    </div>
</div>

<!-- Add Bank Modal -->
<div class="modal-overlay" id="bankModalOverlay">
    <div class="modal modal-sm" id="bankModal">
        <div class="modal-header">
            <h2 class="modal-title">Banka Ekle</h2>
            <button class="modal-close" id="closeBankModal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <form id="bankForm">
                <div class="form-group">
                    <label class="form-label">Banka Adı</label>
                    <input type="text" name="name" id="bankName" class="input-neon" placeholder="örn. Ziraat, Garanti BBVA" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Banka Logosu</label>
                    <div class="file-upload">
                        <input type="file" id="bankLogo" accept="image/*" class="file-input">
                        <label for="bankLogo" class="file-label">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                            <span>Dosya seçin veya buraya sürükleyin</span>
                        </label>
                        <div class="file-preview" id="logoPreview"></div>
                    </div>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" id="cancelBankBtn">İptal</button>
            <button class="btn btn-primary" type="submit" form="bankForm">Bankayı Kaydet</button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const API_URL = '/tracker/api/banks/';

    // DOM Elements
    const addBtn = document.getElementById('addBankBtn');
    const addCard = document.getElementById('addBankCard');
    const emptyAddBtn = document.getElementById('emptyAddBtn');
    const modal = document.getElementById('bankModal');
    const overlay = document.getElementById('bankModalOverlay');
    const closeBtn = document.getElementById('closeBankModal');
    const cancelBtn = document.getElementById('cancelBankBtn');
    const form = document.getElementById('bankForm');
    const submitBtn = form.querySelector('button[type="submit"]') || document.querySelector('.modal-footer .btn-primary');
    const fileInput = document.getElementById('bankLogo');
    const preview = document.getElementById('logoPreview');
    const banksGrid = document.querySelector('.banks-grid');
    const emptyState = document.getElementById('emptyState');

    // CSRF token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    // Modal functions
    function openModal() {
        overlay.classList.add('active');
        modal.classList.add('active');
    }

    function closeModal() {
        overlay.classList.remove('active');
        modal.classList.remove('active');
        form.reset();
        preview.innerHTML = '';
        preview.classList.remove('has-preview');
    }

    // Event listeners for modal
    [addBtn, addCard, emptyAddBtn].forEach(el => {
        if (el) el.addEventListener('click', openModal);
    });
    closeBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeModal();
    });

    // File preview
    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.innerHTML = `<img src="${e.target.result}" alt="Preview">`;
                preview.classList.add('has-preview');
            };
            reader.readAsDataURL(file);
        }
    });

    // Render banks
    function renderBanks(banks) {
        banksGrid.innerHTML = '';

        // Add New Bank card
        const addCardEl = document.createElement('div');
        addCardEl.className = 'bank-card empty-card';
        addCardEl.innerHTML = `
            <div class="bank-add-icon">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </div>
            <span>Yeni Banka Ekle</span>
        `;
        addCardEl.addEventListener('click', openModal);
        banksGrid.appendChild(addCardEl);

        // Bank cards
        banks.forEach(bank => {
            const card = document.createElement('div');
            card.className = 'bank-card';
            card.dataset.id = bank.id;
            card.innerHTML = `
                ${bank.logo ? `<img src="${bank.logo}" alt="${bank.name}" class="bank-logo">` : ''}
                <span class="bank-name">${bank.name}</span>
            `;
            banksGrid.appendChild(card);
        });

        // Empty state
        if (banks.length === 0) {
            emptyState.style.display = 'flex';
        } else {
            emptyState.style.display = 'none';
        }
    }

    // Fetch banks (GET)
    async function loadBanks() {
        try {
            const response = await fetch(API_URL, {
                method: 'GET',
                headers: { 'Content-Type': 'application/json' }
            });
            if (response.ok) {
                const data = await response.json();
                renderBanks(data);
            }
        } catch (error) {
            console.error('Bankalar yüklenirken hata:', error);
        }
    }

    // Create bank (POST)
    async function createBank(formData) {
        try {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Kaydediliyor...';

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrftoken
                },
                body: formData
            });

            if (response.ok) {
                closeModal();
                loadBanks();
            } else {
                const errorData = await response.json();
                console.error('Error:', errorData);
                alert(errorData.name?.[0] || errorData.detail || 'Bir hata oluştu');
            }
        } catch (error) {
            console.error('Network error:', error);
            alert('Ağ hatası. Lütfen tekrar deneyin.');
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Bankayı Kaydet';
        }
    }

    // Form submit
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const name = document.getElementById('bankName').value.trim();
        if (!name) return;

        const formData = new FormData();
        formData.append('name', name);
        if (fileInput.files[0]) {
            formData.append('logo', fileInput.files[0]);
        }
        createBank(formData);
    });

    // Load banks on page load
    loadBanks();
});
</script>
{% endblock %}
