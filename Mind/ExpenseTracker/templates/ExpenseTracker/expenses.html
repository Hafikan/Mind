{% extends 'index.html' %}

{% block title %}Giderler - Mind{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">Giderler</h1>
    <button class="btn btn-primary" id="addExpenseBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>Gider Ekle</span>
    </button>
</div>

<!-- Summary Cards -->
<div class="summary-cards">
    <div class="summary-card">
        <div class="summary-icon expense-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="12" y1="1" x2="12" y2="23"></line>
                <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
            </svg>
        </div>
        <div class="summary-content">
            <span class="summary-label">Toplam Beklenen</span>
            <span class="summary-value">₺0,00</span>
        </div>
    </div>
    <div class="summary-card">
        <div class="summary-icon actual-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
                <polyline points="17 6 23 6 23 12"></polyline>
            </svg>
        </div>
        <div class="summary-content">
            <span class="summary-label">Toplam Gerçekleşen</span>
            <span class="summary-value">₺0,00</span>
        </div>
    </div>
    <div class="summary-card">
        <div class="summary-icon count-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
            </svg>
        </div>
        <div class="summary-content">
            <span class="summary-label">Toplam Gider</span>
            <span class="summary-value">0</span>
        </div>
    </div>
</div>

<!-- Filters -->
<div class="filters-bar">
    <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" class="input-neon" placeholder="Gider ara...">
    </div>
    <select id="filterCategory" class="input-neon select-neon">
        <option value="">Tüm Kategoriler</option>
    </select>
    <input type="month" id="filterMonth" class="input-neon">
</div>

<!-- Category-Grouped Expenses -->
<div id="expensesContainer"></div>

<!-- Add Expense Modal -->
<div class="modal-overlay" id="expenseModalOverlay">
    <div class="modal" id="expenseModal">
        <div class="modal-header">
            <h2 class="modal-title">Gider Ekle</h2>
            <button class="modal-close" id="closeExpenseModal">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>
        <div class="modal-body">
            <form id="expenseForm">
                <div class="form-group">
                    <label class="form-label">Açıklama</label>
                    <input type="text" name="description" class="input-neon" placeholder="Açıklama girin" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Beklenen Tutar</label>
                        <input type="number" step="0.01" name="expected_amount" class="input-neon" placeholder="0.00" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Gerçekleşen Tutar</label>
                        <input type="number" step="0.01" name="actual_amount" class="input-neon" placeholder="0.00">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Kategori</label>
                        <select name="category" class="input-neon select-neon" required>
                            <option value="">Kategori seçin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Ödeme Günü</label>
                        <input type="date" name="pay_day" class="input-neon" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Ödeme Yöntemi</label>
                    <div class="pay-method-toggle">
                        <label class="pay-method-option">
                            <input type="radio" name="payment_method" value="cash" checked>
                            <span>Nakit</span>
                        </label>
                        <label class="pay-method-option">
                            <input type="radio" name="payment_method" value="credit">
                            <span>Kredi Kartı</span>
                        </label>
                    </div>
                </div>
                <div class="form-group" id="cardGroup" hidden>
                    <label class="form-label">Kart</label>
                    <select name="card" id="cardSelect" class="input-neon select-neon">
                        <option value="">Kart seçin</option>
                    </select>
                    <p class="card-hint" id="cardHint"></p>
                </div>
                <div class="form-group">
                    <label class="form-label">Notlar</label>
                    <textarea name="notes" class="input-neon textarea-neon" rows="3" placeholder="İsteğe bağlı notlar..."></textarea>
                </div>
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline" id="cancelExpenseBtn">İptal</button>
            <button class="btn btn-primary" type="submit" form="expenseForm">Gideri Kaydet</button>
        </div>
    </div>
</div>

<style>
.pay-method-toggle {
    display: flex;
    gap: 10px;
}

.pay-method-option {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--bg-elevated);
    cursor: pointer;
    font-size: 13px;
    transition: all var(--transition-speed) ease;
}

.pay-method-option:has(input:checked) {
    border-color: var(--accent-primary);
    color: var(--accent-primary);
    box-shadow: var(--neon-glow);
}

.pay-method-option input {
    accent-color: var(--accent-primary);
}

.card-hint {
    margin-top: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    min-height: 16px;
}

.card-hint.warning {
    color: var(--danger);
}

.pay-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    white-space: nowrap;
}

.pay-badge-cash {
    background: rgba(34, 197, 94, 0.15);
    color: #22c55e;
    border: 1px solid rgba(34, 197, 94, 0.3);
}

.pay-badge-credit {
    background: rgba(168, 85, 247, 0.15);
    color: #a855f7;
    border: 1px solid rgba(168, 85, 247, 0.3);
}

.category-accordion {
    margin-bottom: 16px;
}

.category-accordion-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    cursor: pointer;
    transition: all var(--transition-speed) ease;
    user-select: none;
}

.category-accordion.open .category-accordion-header {
    border-radius: 8px 8px 0 0;
    border-bottom-color: transparent;
    border-color: var(--border-glow);
    box-shadow: var(--neon-glow);
}

.category-accordion-header:hover {
    border-color: var(--border-glow);
    box-shadow: var(--neon-glow);
}

.category-header-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.category-color-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
}

.category-header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
}

.category-header-count {
    font-size: 12px;
    color: var(--text-muted);
    margin-left: 8px;
}

.category-header-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.category-header-total {
    font-size: 14px;
    font-weight: 600;
    color: var(--accent-primary);
}

.category-chevron {
    color: var(--text-muted);
    transition: transform 0.3s ease;
    flex-shrink: 0;
}

.category-accordion.open .category-chevron {
    transform: rotate(180deg);
    color: var(--accent-primary);
}

.category-accordion-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
    background: var(--bg-secondary);
    border: 1px solid var(--border-glow);
    border-top: none;
    border-radius: 0 0 8px 8px;
    opacity: 0;
    visibility: hidden;
}

.category-accordion.open .category-accordion-body {
    opacity: 1;
    visibility: visible;
    border-color: var(--border-glow);
    box-shadow: var(--neon-glow);
}

.category-accordion:not(.open) .category-accordion-body {
    border-color: transparent;
}

.category-accordion-body .data-table th:first-child,
.category-accordion-body .data-table td:first-child {
    padding-left: 20px;
}

.category-accordion-body .data-table th:last-child,
.category-accordion-body .data-table td:last-child {
    padding-right: 20px;
}

.total-row td {
    font-weight: 700 !important;
    color: var(--accent-primary) !important;
    border-bottom: none !important;
    background: var(--bg-elevated);
}

.empty-expenses-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
    text-align: center;
    color: var(--text-muted);
    background: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
}

.empty-expenses-state svg {
    margin-bottom: 16px;
    opacity: 0.5;
}

.empty-expenses-state p {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 4px;
}
</style>
{% endblock %}

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const addBtn = document.getElementById('addExpenseBtn');
    const modal = document.getElementById('expenseModal');
    const overlay = document.getElementById('expenseModalOverlay');
    const closeBtn = document.getElementById('closeExpenseModal');
    const cancelBtn = document.getElementById('cancelExpenseBtn');
    const categorySelect = modal.querySelector('select[name="category"]');
    const container = document.getElementById('expensesContainer');
    const summaryValues = document.querySelectorAll('.summary-value');
    const modalTitle = modal.querySelector('.modal-title');
    const searchInput = document.getElementById('searchInput');
    const filterCategory = document.getElementById('filterCategory');
    const filterMonth = document.getElementById('filterMonth');

    let editingId = null;
    let allExpenses = [];
    let openCategories = new Set();

    function formatCurrency(value) {
        return `₺${parseFloat(value || 0).toFixed(2).replace('.', ',')}`;
    }

    const emptyHTML = `
        <div class="empty-expenses-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
                <line x1="1" y1="10" x2="23" y2="10"></line>
            </svg>
            <p>Gider bulunamadı</p>
            <span class="text-muted">Başlamak için ilk giderini ekle</span>
        </div>
    `;

    function buildQueryParams() {
        const params = new URLSearchParams();
        const categoryId = filterCategory.value;
        const monthValue = filterMonth.value;

        if (categoryId) {
            params.append('category', categoryId);
        }
        if (monthValue) {
            const [year, month] = monthValue.split('-');
            params.append('year', year);
            params.append('month', month);
        }
        return params.toString();
    }

    async function loadExpenses() {
        try {
            const query = buildQueryParams();
            const url = '/tracker/api/expenses/' + (query ? '?' + query : '');
            const response = await fetch(url);
            if (response.ok) {
                allExpenses = await response.json();
                applySearch();
                updateSummaryFromData(allExpenses);
            }
        } catch (error) {
            console.error('Failed to load expenses:', error);
        }
    }

    function updateSummaryFromData(expenses) {
        let totalExpected = 0;
        let totalActual = 0;
        expenses.forEach(exp => {
            totalExpected += parseFloat(exp.expected_amount || 0);
            totalActual += parseFloat(exp.actual_amount || 0);
        });
        summaryValues[0].textContent = formatCurrency(totalExpected);
        summaryValues[1].textContent = formatCurrency(totalActual);
        summaryValues[2].textContent = expenses.length;
    }

    function applySearch() {
        const searchTerm = searchInput.value.toLowerCase();
        let filtered = allExpenses;

        if (searchTerm) {
            filtered = filtered.filter(exp =>
                exp.description.toLowerCase().includes(searchTerm) ||
                (exp.notes && exp.notes.toLowerCase().includes(searchTerm))
            );
        }

        renderGroupedExpenses(filtered);
    }

    function applyFilters() {
        loadExpenses();
    }

    function groupByCategory(expenses) {
        const groups = {};
        expenses.forEach(exp => {
            const catName = exp.category_name || 'Kategorisiz';
            if (!groups[catName]) {
                groups[catName] = { expenses: [], color: null };
            }
            groups[catName].expenses.push(exp);
        });
        return groups;
    }

    function renderGroupedExpenses(expenses) {
        if (expenses.length === 0) {
            container.innerHTML = emptyHTML;
            return;
        }

        const groups = groupByCategory(expenses);
        const categoryNames = Object.keys(groups).sort();

        // If only one category, auto-open it
        if (categoryNames.length === 1 && openCategories.size === 0) {
            openCategories.add(categoryNames[0]);
        }

        container.innerHTML = categoryNames.map(catName => {
            const group = groups[catName];
            const exps = group.expenses;
            const isOpen = openCategories.has(catName);
            const totalExpected = exps.reduce((sum, e) => sum + parseFloat(e.expected_amount || 0), 0);
            const totalActual = exps.reduce((sum, e) => sum + parseFloat(e.actual_amount || 0), 0);

            return `
            <div class="category-accordion ${isOpen ? 'open' : ''}" data-category="${catName}">
                <div class="category-accordion-header">
                    <div class="category-header-left">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <span class="category-header-title">${catName}</span>
                        <span class="category-header-count">(${exps.length})</span>
                    </div>
                    <div class="category-header-right">
                        <span class="category-header-total">${formatCurrency(totalActual)}</span>
                        <svg class="category-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </div>
                </div>
                <div class="category-accordion-body" style="${isOpen ? 'max-height: 2000px; opacity: 1; visibility: visible;' : ''}">
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Açıklama</th>
                                    <th>Beklenen</th>
                                    <th>Gerçekleşen</th>
                                    <th>Ödeme Günü</th>
                                    <th>Ödeme</th>
                                    <th>İşlemler</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${exps.map(exp => `
                                <tr data-id="${exp.id}">
                                    <td>${escapeHtml(exp.description)}</td>
                                    <td>${formatCurrency(exp.expected_amount)}</td>
                                    <td>${formatCurrency(exp.actual_amount)}</td>
                                    <td>${exp.pay_day}</td>
                                    <td>${paymentBadge(exp)}</td>
                                    <td>
                                        <div class="action-btns">
                                            <button class="action-btn edit-btn" title="Düzenle">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                </svg>
                                            </button>
                                            <button class="action-btn delete delete-btn" title="Sil">
                                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                                    <polyline points="3 6 5 6 21 6"></polyline>
                                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                </svg>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                `).join('')}
                                <tr class="total-row">
                                    <td>Toplam</td>
                                    <td>${formatCurrency(totalExpected)}</td>
                                    <td>${formatCurrency(totalActual)}</td>
                                    <td></td>
                                    <td></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            `;
        }).join('');
    }

    // Accordion toggle (event delegation)
    container.addEventListener('click', function(e) {
        const header = e.target.closest('.category-accordion-header');
        if (header) {
            const accordion = header.closest('.category-accordion');
            const catName = accordion.dataset.category;
            const body = accordion.querySelector('.category-accordion-body');

            if (accordion.classList.contains('open')) {
                accordion.classList.remove('open');
                body.style.maxHeight = '0';
                openCategories.delete(catName);
            } else {
                accordion.classList.add('open');
                body.style.maxHeight = body.scrollHeight + 'px';
                openCategories.add(catName);
            }
            return;
        }

        // Edit / Delete
        const row = e.target.closest('tr[data-id]');
        if (!row) return;
        const id = row.dataset.id;

        const editBtn = e.target.closest('.edit-btn');
        if (editBtn) {
            fetch(`/tracker/api/expenses/${id}/`)
                .then(r => r.ok ? r.json() : null)
                .then(expense => { if (expense) openModal(expense); });
        }

        const deleteBtn = e.target.closest('.delete-btn');
        if (deleteBtn) {
            deleteExpense(id);
        }
    });

    async function loadCategories() {
        try {
            const response = await fetch('/tracker/api/categories/');
            if (response.ok) {
                const categories = await response.json();
                categorySelect.innerHTML = '<option value="">Kategori seçin</option>';
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = cat.name;
                    categorySelect.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Failed to load categories:', error);
        }
    }

    function escapeHtml(value) {
        return String(value === null || value === undefined ? '' : value).replace(
            /[&<>"']/g,
            c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])
        );
    }

    function paymentBadge(expense) {
        if (expense.payment_method !== 'credit') {
            return '<span class="pay-badge pay-badge-cash">Nakit</span>';
        }
        const cutoff = expense.target_cutoff_date
            ? new Date(expense.target_cutoff_date).toLocaleDateString('tr-TR')
            : '';
        const title = cutoff ? ` title="${cutoff} ekstresine yazıldı"` : '';
        return `<span class="pay-badge pay-badge-credit"${title}>${escapeHtml(expense.card_name || 'Kart')}</span>`;
    }

    // ----- KREDI KARTI ODEMESI -----

    let cards = [];
    const cardGroup = document.getElementById('cardGroup');
    const cardSelect = document.getElementById('cardSelect');
    const cardHint = document.getElementById('cardHint');

    async function loadCards() {
        if (cards.length) return;
        try {
            const response = await fetch('/tracker/api/banks/summary/');
            if (!response.ok) return;
            cards = await response.json();
            cardSelect.innerHTML = '<option value="">Kart seçin</option>';
            cards.forEach(card => {
                const option = document.createElement('option');
                option.value = card.id;
                option.textContent = card.name;
                cardSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Kartlar yüklenemedi:', error);
        }
    }

    function selectedMethod() {
        const checked = document.querySelector('[name="payment_method"]:checked');
        return checked ? checked.value : 'cash';
    }

    /**
     * Harcamanin dusecegi kesim tarihi. Kesim gecmisse bir sonraki doneme
     * kayar; sunucudaki statement_cutoff_for ile ayni kurali uygular.
     * Bu yalnizca bir ipucudur, dogrulamayi sunucu yapar.
     */
    function targetCutoff(spendISO, statementDay) {
        if (!spendISO || !statementDay) return null;
        const [y, m, d] = spendISO.split('-').map(Number);
        const clampedDay = Math.min(statementDay, new Date(y, m, 0).getDate());
        if (d <= clampedDay) return new Date(y, m - 1, clampedDay);
        const ny = m === 12 ? y + 1 : y;
        const nm = m === 12 ? 1 : m + 1;
        return new Date(ny, nm - 1, Math.min(statementDay, new Date(ny, nm, 0).getDate()));
    }

    function updateCardHint() {
        const isCredit = selectedMethod() === 'credit';
        cardGroup.hidden = !isCredit;
        cardSelect.required = isCredit;
        if (!isCredit) {
            cardHint.textContent = '';
            return;
        }

        const card = cards.find(c => String(c.id) === cardSelect.value);
        if (!card) {
            cardHint.className = 'card-hint';
            cardHint.textContent = 'Harcamanın hangi ekstreye yazılacağını görmek için kart seçin.';
            return;
        }
        if (!card.effective_statement_day) {
            cardHint.className = 'card-hint warning';
            cardHint.textContent =
                `${card.name} için hesap kesim günü tanımlı değil. Bankalar sayfasından girin.`;
            return;
        }

        const payDay = document.querySelector('[name="pay_day"]').value;
        const cutoff = targetCutoff(payDay, card.effective_statement_day);
        cardHint.className = 'card-hint';
        cardHint.textContent = cutoff
            ? `Bu harcama ${card.name} kartının ${cutoff.toLocaleDateString('tr-TR')} ekstresine yazılacak.`
            : `Ekstre dönemini görmek için ödeme günü girin.`;
    }

    document.querySelectorAll('[name="payment_method"]').forEach(radio => {
        radio.addEventListener('change', updateCardHint);
    });
    cardSelect.addEventListener('change', updateCardHint);
    document.querySelector('[name="pay_day"]').addEventListener('change', updateCardHint);

    async function openModal(expense = null) {
        await Promise.all([loadCategories(), loadCards()]);
        editingId = expense ? expense.id : null;
        modalTitle.textContent = expense ? 'Gideri Düzenle' : 'Gider Ekle';

        const form = document.getElementById('expenseForm');
        if (expense) {
            form.querySelector('[name="description"]').value = expense.description;
            form.querySelector('[name="expected_amount"]').value = expense.expected_amount;
            form.querySelector('[name="actual_amount"]').value = expense.actual_amount || '';
            form.querySelector('[name="category"]').value = expense.category;
            form.querySelector('[name="pay_day"]').value = expense.pay_day;
            form.querySelector('[name="notes"]').value = expense.notes || '';
            form.querySelector(`[name="payment_method"][value="${expense.payment_method}"]`).checked = true;
            cardSelect.value = expense.card || '';
        } else {
            form.reset();
            cardSelect.value = '';
        }
        updateCardHint();

        overlay.classList.add('active');
        modal.classList.add('active');
    }

    function closeModal() {
        overlay.classList.remove('active');
        modal.classList.remove('active');
        editingId = null;
    }

    async function deleteExpense(id) {
        if (!confirm('Bu gideri silmek istediğinizden emin misiniz?')) return;

        try {
            const response = await fetch(`/tracker/api/expenses/${id}/`, {
                method: 'DELETE',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken')
                }
            });
            if (response.ok) {
                loadExpenses();
            } else {
                alert('Gider silinemedi');
            }
        } catch (error) {
            console.error('Failed to delete expense:', error);
        }
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const expenseForm = document.getElementById('expenseForm');

    async function saveExpense(data) {
        try {
            const url = editingId
                ? `/tracker/api/expenses/${editingId}/`
                : '/tracker/api/expenses/';
            const method = editingId ? 'PUT' : 'POST';

            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': getCookie('csrftoken')
                },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                closeModal();
                expenseForm.reset();
                loadExpenses();
            } else {
                const error = await response.json();
                alert('Kaydedilemedi: ' + JSON.stringify(error));
            }
        } catch (error) {
            console.error('Failed to save expense:', error);
        }
    }

    expenseForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(expenseForm);
        const method = formData.get('payment_method') || 'cash';
        const data = {
            description: formData.get('description'),
            expected_amount: formData.get('expected_amount'),
            actual_amount: formData.get('actual_amount') || null,
            category: formData.get('category'),
            pay_day: formData.get('pay_day'),
            notes: formData.get('notes') || '',
            payment_method: method,
            // Nakit giderde kart alani bos gitmeli; dolu kalirsa sunucu reddeder.
            card: method === 'credit' ? formData.get('card') || null : null
        };
        saveExpense(data);
    });

    addBtn.addEventListener('click', () => openModal());
    closeBtn.addEventListener('click', closeModal);
    cancelBtn.addEventListener('click', closeModal);
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) closeModal();
    });

    // Filter event listeners
    searchInput.addEventListener('input', applySearch);
    filterCategory.addEventListener('change', applyFilters);
    filterMonth.addEventListener('change', applyFilters);

    // Load filter categories
    async function loadFilterCategories() {
        try {
            const response = await fetch('/tracker/api/categories/');
            if (response.ok) {
                const categories = await response.json();
                filterCategory.innerHTML = '<option value="">Tüm Kategoriler</option>';
                categories.forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = cat.name;
                    filterCategory.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Failed to load filter categories:', error);
        }
    }

    // Load on page load
    loadFilterCategories();
    loadExpenses();
});
</script>
{% endblock %}
