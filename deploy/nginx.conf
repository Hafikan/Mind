upstream mind_app {
    server api-provider:8080;
}

server {
    listen 80;
    server_name _;

    # Banka logosu / avatar yuklemeleri icin; Django tarafinda ayrica sinir yok.
    client_max_body_size 10M;

    # Statik ve medya dosyalarini Python'a hic ugratmadan nginx servis eder;
    # DEBUG kapaliyken Django bunlari zaten servis etmez.
    location /static/ {
        alias /srv/static/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://mind_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Django'nun SECURE_PROXY_SSL_HEADER ayari bu basligi okuyor.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
